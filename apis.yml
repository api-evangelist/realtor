  - url: https://www.realtor.com/marketing/connections/
    type: Documentation
  - url: asyncapi/realtor-connections-plus-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Realtor.com Connections Plus API provides a direct connection between the Realtor.com lead delivery
    system and supporting CRM platforms. It enables real estate agents, brokers, and offices to receive
    buyer and seller leads in real time via API rather than email. The API delivers richer lead data including
    listing URLs, geographic coordinates, dates, and MLS information that are not available through standard
    email delivery.
