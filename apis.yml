    type: AsyncAPI
  description: >-
    The Realtor.com Lead Delivery API is an end-to-end integration layer that delivers real estate leads
    directly from Realtor.com to third-party CRM systems. It provides faster and more secure lead delivery
    compared to traditional email-based methods, with consistent formatting and additional data fields.
